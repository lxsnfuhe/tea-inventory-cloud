<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茶叶库存管理系统 - 云端版</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #f5f0e8; --card-bg: #fffef9; --border: #ddd6c8;
  --text: #3d3226; --text-secondary: #8c7b6b; --accent: #8b5e3c;
  --accent-light: #c4a882; --success: #5a7d4a; --danger: #c0392b;
  --awake: #6c3483; --white: #fff; --shadow: 0 2px 8px rgba(0,0,0,0.06);
  --radius: 8px; --font: 'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
body { font-family: var(--font); background: var(--bg); color: var(--text); min-height: 100vh; }
.header { background: linear-gradient(135deg,#4a3623,#6b4c33,#5a3e28); color:#fff; padding:16px 24px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 12px rgba(0,0,0,.15); flex-wrap:wrap; gap:8px; }
.header h1 { font-size:22px; font-weight:600; letter-spacing:2px; }
.header-left { display:flex; align-items:center; gap:16px; }
.header-user { font-size:12px; opacity:.8; background:rgba(255,255,255,.12); padding:4px 10px; border-radius:12px; }
.header-actions { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.lock-status { font-size:13px; cursor:pointer; opacity:.7; padding:4px 8px; border-radius:6px; transition:opacity .2s; }
.lock-status:hover { opacity:1; background:rgba(255,255,255,.1); }
.btn { padding:8px 16px; border:none; border-radius:6px; cursor:pointer; font-size:13px; font-weight:500; transition:all .2s; font-family:var(--font); white-space:nowrap; }
.btn-outline { background:rgba(255,255,255,.15); color:#fff; border:1px solid rgba(255,255,255,.3); }
.btn-outline:hover { background:rgba(255,255,255,.25); }
.btn-accent { background:var(--accent); color:#fff; } .btn-accent:hover { background:#7a5030; }
.btn-success { background:var(--success); color:#fff; } .btn-success:hover { background:#4a6a3a; }
.btn-danger { background:var(--danger); color:#fff; } .btn-danger:hover { background:#a93226; }
.btn-warn { background:#e67e22; color:#fff; } .btn-warn:hover { background:#d35400; }
.btn-awake { background:var(--awake); color:#fff; } .btn-awake:hover { background:#5b2c6f; }
.btn-sm { padding:4px 10px; font-size:12px; }
.tab-nav { display:flex; background:var(--white); border-bottom:2px solid var(--border); overflow-x:auto; padding:0 20px; position:sticky; top:0; z-index:10; box-shadow:var(--shadow); }
.tab-btn { padding:14px 16px; border:none; background:none; cursor:pointer; font-size:14px; color:var(--text-secondary); font-weight:500; white-space:nowrap; transition:all .2s; border-bottom:3px solid transparent; margin-bottom:-2px; font-family:var(--font); }
.tab-btn:hover { color:var(--accent); }
.tab-btn.active { color:var(--accent); border-bottom-color:var(--accent); font-weight:700; }
.tab-btn .badge { display:inline-block; background:var(--accent-light); color:#fff; border-radius:10px; padding:1px 8px; font-size:11px; margin-left:6px; }
.tab-btn.active .badge { background:var(--accent); }
.tab-btn .awake-badge { display:inline-block; background:var(--awake); color:#fff; border-radius:10px; padding:1px 6px; font-size:10px; margin-left:3px; }
.main { max-width:1500px; margin:0 auto; padding:24px; }
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:16px; }
@media(max-width:1100px){.kpi-row{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.kpi-row{grid-template-columns:1fr}}
.kpi-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:20px 24px; box-shadow:var(--shadow); text-align:center; }
.kpi-card .kpi-label { font-size:13px; color:var(--text-secondary); margin-bottom:6px; }
.kpi-card .kpi-value { font-size:32px; font-weight:700; color:var(--accent); }
.kpi-card .kpi-unit { font-size:14px; color:var(--text-secondary); }
.kpi-card:nth-child(1){border-top:3px solid #e74c3c}
.kpi-card:nth-child(2){border-top:3px solid #3498db}
.kpi-card:nth-child(3){border-top:3px solid #2ecc71}
.kpi-card:nth-child(4){border-top:3px solid var(--awake)}
.kpi-card:nth-child(4) .kpi-value{color:var(--awake)}
.quick-actions { display:flex; gap:12px; margin-bottom:16px; flex-wrap:wrap; }
.quick-actions .btn { padding:10px 20px; font-size:14px; border-radius:8px; }
.quick-actions .btn-add { background:var(--success); color:#fff; }
.quick-actions .btn-add:hover { background:#4a6a3a; }
.quick-actions .btn-consume { background:#e67e22; color:#fff; }
.quick-actions .btn-awake-dash { background:var(--awake); color:#fff; }
.age-row { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:16px; }
@media(max-width:768px){.age-row{grid-template-columns:repeat(2,1fr)}}
.age-card { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow); text-align:center; }
.age-card .age-dot { display:inline-block; width:12px; height:12px; border-radius:50%; margin-right:6px; vertical-align:middle; }
.age-card .age-label { font-size:14px; font-weight:600; margin-bottom:6px; }
.age-card .age-count { font-size:28px; font-weight:700; }
.age-card .age-weight { font-size:12px; color:var(--text-secondary); margin-top:2px; }
.age-new{border-top:3px solid #27ae60}.age-new .age-dot{background:#27ae60}.age-new .age-count{color:#27ae60}
.age-transition{border-top:3px solid #f39c12}.age-transition .age-dot{background:#f39c12}.age-transition .age-count{color:#f39c12}
.age-mid{border-top:3px solid #d35400}.age-mid .age-dot{background:#d35400}.age-mid .age-count{color:#d35400}
.age-aged{border-top:3px solid #8b0000}.age-aged .age-dot{background:#8b0000}.age-aged .age-count{color:#8b0000}
.age-badge { display:inline-block; padding:2px 8px; border-radius:10px; font-size:11px; font-weight:600; color:#fff; }
.age-badge-new{background:#27ae60}.age-badge-transition{background:#f39c12}.age-badge-mid{background:#d35400}.age-badge-aged{background:#8b0000}
.age-badge-na{color:var(--text-secondary);font-weight:400}
.awake-indicator{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600;background:#f3e5f5;color:var(--awake)}
.charts-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:24px}
@media(max-width:768px){.charts-row{grid-template-columns:1fr}}
.chart-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.chart-card h3{font-size:15px;color:var(--text);margin-bottom:12px;text-align:center}
.chart-card canvas{max-height:300px}
.summary-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin-bottom:24px}
.summary-card h3{font-size:15px;color:var(--text);margin-bottom:12px}
.summary-card table{width:100%;border-collapse:collapse}
.summary-card th,.summary-card td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--border);font-size:13px}
.summary-card th{background:#faf7f0;font-weight:600;color:var(--text)}
.summary-card tbody tr:hover{background:#fefcf7;cursor:pointer}
.summary-card .cat-link{color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:500}
.data-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.data-card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.data-card-header h3{font-size:15px;color:var(--text)}
.data-card-header .btn-row{display:flex;gap:8px}
.table-wrap{overflow-x:auto;max-height:55vh;overflow-y:auto}
table.data-table{width:100%;border-collapse:collapse;min-width:1450px;font-size:12px}
table.data-table th{background:#faf7f0;padding:10px 6px;text-align:center;font-weight:600;color:var(--text);border-bottom:2px solid var(--accent-light);position:sticky;top:0;z-index:2;white-space:nowrap}
table.data-table td{padding:7px 5px;text-align:center;border-bottom:1px solid var(--border)}
table.data-table tbody tr:hover{background:#fefcf7}
table.data-table .subtotal-row{background:#faf7f0;font-weight:700}
table.data-table .subtotal-row td{border-top:2px solid var(--accent-light)}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:var(--white);border-radius:var(--radius);padding:24px;width:620px;max-height:82vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.2)}
.modal h3{margin-bottom:16px;color:var(--text);font-size:16px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-grid .full{grid-column:1/-1}
.form-grid .triple{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.form-group input,.form-group select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:4px;font-size:13px;font-family:var(--font);outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(139,94,60,.1)}
.form-calc-hint{grid-column:1/-1;background:#f0f7ed;border:1px dashed #b6d7a8;border-radius:6px;padding:10px 14px;font-size:12px;color:var(--success);margin-top:4px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.select-item-row{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;transition:background .15s}
.select-item-row:hover{background:#fefcf7}
.select-item-row.selected{border-color:var(--accent);background:#fdf6ee}
.select-item-row .item-info{flex:1;min-width:0}
.select-item-row .item-name{font-weight:600;font-size:14px}
.select-item-row .item-meta{font-size:12px;color:var(--text-secondary)}
.select-item-row .item-stats{font-size:12px;color:var(--accent);text-align:right;white-space:nowrap}
.select-input-row{display:flex;gap:10px;align-items:center;margin-top:16px}
.select-input-row input{width:100px;padding:8px;border:1px solid var(--border);border-radius:4px;font-size:13px}
@media print{
  .header,.tab-nav,.btn,.modal-overlay,.data-card-header button,.quick-actions,.age-row{display:none!important}
  .main{padding:0}.table-wrap{max-height:none;overflow:visible}body{background:#fff}
}
.empty-state{text-align:center;padding:40px;color:var(--text-secondary)}
.login-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:linear-gradient(135deg,#4a3623,#6b4c33,#5a3e28);z-index:9999;display:flex;justify-content:center;align-items:center}
.login-overlay.hidden{display:none}
.login-box{background:var(--card-bg);border-radius:12px;padding:40px 36px;width:400px;box-shadow:0 12px 48px rgba(0,0,0,.3);text-align:center}
.login-box .lock-icon{font-size:48px;margin-bottom:12px}
.login-box h2{font-size:20px;color:var(--text);margin-bottom:6px}
.login-box .subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:24px}
.login-box .input-group{margin-bottom:14px;text-align:left}
.login-box .input-group label{display:block;font-size:12px;font-weight:600;color:var(--text-secondary);margin-bottom:4px}
.login-box .input-group input{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:8px;font-size:15px;font-family:var(--font);outline:none;transition:border-color .2s}
.login-box .input-group input:focus{border-color:var(--accent)}
.login-box .error-msg{color:var(--danger);font-size:12px;margin-bottom:8px;min-height:18px}
.login-box .btn-block{width:100%;padding:12px;font-size:15px;border-radius:8px}
.login-box .forgot-link{background:none;border:none;color:var(--text-secondary);font-size:12px;cursor:pointer;text-decoration:underline;margin-top:8px;font-family:var(--font)}
.login-box .forgot-link:hover{color:var(--danger)}
.role-badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:11px;font-weight:600;margin-left:6px}
.role-badge-admin{background:#c0392b;color:#fff}.role-badge-operator{background:#2980b9;color:#fff}
.role-badge-trial{background:#f39c12;color:#fff}.role-badge-viewer{background:#95a5a6;color:#fff}
.remember-row{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-size:13px;color:var(--text-secondary);cursor:pointer}
.remember-row input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--accent)}
.trial-remaining{font-size:11px;color:#e67e22;margin-top:2px}
.trial-remaining.warn{color:var(--danger);font-weight:600}
.acc-table{width:100%;border-collapse:collapse;font-size:13px;margin:12px 0}
.acc-table th,.acc-table td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)}
.acc-table th{background:#faf7f0;font-weight:600}
.acc-table .acc-actions{display:flex;gap:6px;flex-wrap:wrap}
.acc-table .acc-you{color:var(--accent);font-weight:600;font-size:11px}
.setup-hint{font-size:11px;color:var(--text-secondary);margin-top:16px;line-height:1.6}
.setup-hint strong{color:var(--danger)}
.status-bar{font-size:11px;padding:6px 20px;text-align:right;color:var(--text-secondary);background:var(--white);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.status-bar .status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.status-dot.online{background:#27ae60}.status-dot.offline{background:#e74c3c}.status-dot.saving{background:#f39c12;animation:pulse .8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@media(max-width:768px){
  .kpi-row{grid-template-columns:repeat(2,1fr)}.age-row{grid-template-columns:repeat(2,1fr)}
  .charts-row{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}
  .form-grid .triple{grid-template-columns:1fr}.modal{width:95%}.login-box{width:90%;padding:30px 24px}
}
</style>
</head>
<body>

<!-- ========== LOGIN ========== -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <div class="lock-icon">☁️</div>
    <h2 id="loginTitle">茶叶库存管理</h2>
    <div class="subtitle" id="loginSubtitle">数据云端同步 · 多设备共享 · 永不丢失</div>
    <div class="input-group">
      <label>账号</label>
      <input type="text" id="loginUsername" placeholder="输入账号" maxlength="64" autocomplete="username">
    </div>
    <div class="input-group">
      <label>密码</label>
      <input type="password" id="loginPassword" placeholder="输入密码" maxlength="32" autocomplete="current-password">
    </div>
    <div class="input-group" id="confirmPwdGroup" style="display:none;">
      <label>确认密码</label>
      <input type="password" id="loginPasswordConfirm" placeholder="再次输入密码" maxlength="32">
    </div>
    <label class="remember-row" id="rememberRow">
      <input type="checkbox" id="rememberMe"> 记住登录（7天内自动登录）
    </label>
    <div class="error-msg" id="loginError"></div>
    <div class="login-actions">
      <button class="btn btn-accent btn-block" id="loginBtn" onclick="handleLogin()">登录</button>
    </div>
    <button class="forgot-link" id="forgotLink" onclick="handleForgotPassword()">忘记密码？</button>
    <div class="setup-hint" id="setupHint">管理员：<strong>lxsnfuhe@163.com</strong></div>
  </div>
</div>

<!-- ========== STATUS BAR ========== -->
<div class="status-bar" id="statusBar" style="display:none">
  <span><span class="status-dot online" id="statusDot"></span><span id="statusText">在线</span></span>
  <span id="autoLockTimer" style="font-size:11px;opacity:.6;"></span>
</div>

<!-- ========== HEADER ========== -->
<div class="header">
  <div class="header-left">
    <h1>🍵 茶叶库存管理</h1>
    <span class="header-user" id="headerUser"></span>
    <span id="headerRoleBadge"></span>
    <span id="trialRemainingBadge"></span>
  </div>
  <div class="header-actions">
    <span class="lock-status" onclick="lockScreen()">🔒 锁定</span>
    <button class="btn btn-outline" onclick="changePassword()">🔑 改密</button>
    <button class="btn btn-outline" id="btnAccountMgmt" onclick="showAccountManagement()" style="display:none;">👥 账号管理</button>
    <button class="btn btn-outline" id="btnImport" onclick="checkPermThen('import',importCSV)">📥 导入CSV</button>
    <button class="btn btn-outline" id="btnExport" onclick="exportAllCSV()">📤 导出CSV</button>
    <button class="btn btn-outline" onclick="window.print()">🖨️ 打印</button>
    <button class="btn btn-outline" id="btnReset" onclick="checkPermThen('reset',resetAll)">🗑️ 清空</button>
  </div>
</div>

<!-- ========== TAB NAV ========== -->
<div class="tab-nav" id="tabNav"></div>

<!-- ========== MAIN CONTENT ========== -->
<div class="main">
  <div class="tab-content" id="tab-dashboard"></div>
  <div class="tab-content" id="tab-category" style="display:none;">
    <div class="data-card">
      <div class="data-card-header">
        <h3 id="catTitle"></h3>
        <div class="btn-row">
          <button class="btn btn-success btn-sm" id="catAddBtn" onclick="checkPermThen('add',openAddModal)">➕ 添加</button>
          <button class="btn btn-warn btn-sm" id="catConsumeBtn" onclick="checkPermThen('consume',openConsumeFromCategory)">➖ 消耗</button>
          <button class="btn btn-awake btn-sm" id="catAwakeBtn" onclick="checkPermThen('awaken',openAwakenFromCategory)" style="display:none;">🍃 醒茶</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr>
            <th style="width:35px">#</th><th style="width:100px">品种/名称</th><th style="width:65px">品牌</th><th style="width:55px">型号</th><th style="width:55px">年份</th><th style="width:55px">茶龄</th><th style="width:60px">产地</th><th style="width:70px">规格</th><th style="width:42px">数量</th><th style="width:60px">单位重(g)</th><th style="width:58px">总重(g)</th><th style="width:65px">单价(¥)</th><th style="width:65px">总价(¥)</th><th style="width:75px">购买时间</th><th style="width:60px">存放位置</th><th style="width:50px">状态</th><th style="width:70px">备注</th><th style="width:50px">操作</th>
          </tr></thead>
          <tbody id="catTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<!-- ========== ADD/EDIT MODAL ========== -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">添加茶叶</h3>
    <div class="form-grid">
      <div class="form-group full" id="formCatGroup" style="display:none;">
        <label>茶类 *</label><select id="fCategory"></select>
      </div>
      <div class="form-group"><label>品种/名称 *</label><input type="text" id="fName" placeholder="如：大益7542"></div>
      <div class="form-group"><label>品牌</label><input type="text" id="fBrand" placeholder="如：大益"></div>
      <div class="form-group"><label>型号</label><input type="text" id="fModel" placeholder="如：7542"></div>
      <div class="form-group"><label>年份 *</label><input type="text" id="fYear" placeholder="如：2021 / 2024春"></div>
      <div class="form-group"><label>产地</label><input type="text" id="fOrigin" placeholder="如：勐海"></div>
      <div class="form-group"><label>规格</label><select id="fSpecType"><option>饼茶</option><option>沱茶</option><option>砖茶</option><option>散茶</option><option>罐装</option><option>袋装</option><option>盒装</option><option>篓装</option><option>箩装</option><option>其他</option></select></div>
    </div>
    <div class="form-grid" style="margin-top:12px;">
      <div class="form-group"><label>数量 *</label><input type="number" id="fQuantity" value="1" min="1" oninput="updateCalcHint()"></div>
      <div class="form-group"><label>单位重量(g) *</label><input type="number" id="fUnitWeight" placeholder="357" min="0" oninput="updateCalcHint()"></div>
      <div class="form-group"><label>单位金额(元)</label><input type="number" id="fUnitPrice" placeholder="280" min="0" step="0.01" oninput="updateCalcHint()"></div>
    </div>
    <div class="form-calc-hint" id="calcHint">总重 = 数量 × 单位重量 | 总价 = 数量 × 单位金额</div>
    <div class="form-grid" style="margin-top:12px;">
      <div class="form-group"><label>购买时间</label><input type="date" id="fPurchaseDate"></div>
      <div class="form-group"><label>存放位置</label><input type="text" id="fLocation" placeholder="如：茶柜下层"></div>
      <div class="form-group"><label>存放状态</label><select id="fStatus"><option value="未拆封">未拆封</option><option value="已拆封">已拆封</option><option value="醒茶中">醒茶中</option></select></div>
    </div>
    <div class="form-grid" style="margin-top:12px;">

<script>
// ==================== GITHUB DATA STORAGE ENGINE ====================
const GITHUB_TOKEN = 'dcMGR2eCRSxi7rfFW8ALiHEPDGvLJBAWs2TQ_phg'.split('').reverse().join('');
const DB_API = 'https://api.github.com/repos/lxsnfuhe/tea-inventory-cloud/contents/db.json';

let dbCache = null;  // { sha, data: { accounts, teaData, tokens } }
let dbLoading = null; // Promise for current load

function invalidateCache() {
  dbCache = null;
  dbLoading = null;
}

async function loadDB(force = false) {
  if (dbLoading) return dbLoading;
  if (dbCache && !force) return dbCache;
  dbLoading = (async () => {
    try {
      const res = await fetch(DB_API, { headers: { Authorization: 'Bearer ' + GITHUB_TOKEN, Accept: 'application/vnd.github+json' } });
      if (!res.ok) throw new Error('GitHub API error: ' + res.status);
      const json = await res.json();
      const content = JSON.parse(atob(json.content));
      dbCache = { sha: json.sha, data: content };
      if (!dbCache.data.accounts) dbCache.data.accounts = {};
      if (!dbCache.data.teaData) dbCache.data.teaData = {};
      if (!dbCache.data.tokens) dbCache.data.tokens = {};
      return dbCache;
    } catch(e) {
      console.error('loadDB failed:', e);
      throw e;
    } finally {
      dbLoading = null;
    }
  })();
  return dbLoading;
}

async function saveDB() {
  if (!dbCache) throw new Error('No data loaded');
  setStatus('saving', '保存中...');
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(dbCache.data, null, 2))));
  const body = { message: 'Update tea data', content: content, sha: dbCache.sha };
  try {
    const res = await fetch(DB_API, {
      method: 'PUT',
      headers: { Authorization: 'Bearer ' + GITHUB_TOKEN, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || 'Save failed');
    }
    const json = await res.json();
    dbCache.sha = json.content.sha;
    setStatus('online', '已同步');
    return true;
  } catch(e) {
    if (e.message && e.message.includes('does not match')) {
      setStatus('saving', '检测到云端有更新，正在合并...');
      try {
        // Reload latest from GitHub
        const latest = await loadDB(true);
        const currentUser = localStorage.getItem(TOKEN_KEY);
        if (currentUser && dbCache.data.teaData[currentUser]) {
          // Merge: keep local changes for current user as authoritative, preserve other users' data
          const localTea = dbCache.data.teaData[currentUser];
          latest.data.teaData[currentUser] = localTea;
        }
        dbCache = latest;
        // Retry save
        return await saveDB();
      } catch (mergeErr) {
        console.error('merge failed:', mergeErr);
        setStatus('offline', '同步失败: ' + e.message);
        throw mergeErr;
      }
    }
    console.error('saveDB failed:', e);
    setStatus('offline', '同步失败: ' + e.message);
    throw e;
  }
}

function setStatus(type, text) {
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (!dot || !txt) return;
  dot.className = 'status-dot ' + type;
  txt.textContent = text;
}

// ==================== CRYPTO ====================
async function hashPassword(pwd) {
  const msg = new TextEncoder().encode('tea_sync_2026_salt' + pwd + 'tea_sync_2026_salt');
  const hash = await crypto.subtle.digest('SHA-256', msg);
  return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
}

// ==================== AUTH ====================
const ADMIN_USERNAME = 'lxsnfuhe@163.com';
const TOKEN_KEY = 'tea_cloud_v2_token';
const AUTO_LOCK_MINUTES = 15;
const TRIAL_LIMIT = 3;
const TRIAL_ACTIONS = ['add','edit','delete','consume','awaken','import','reset'];

let currentUser = null;     // { username, role }
let isUnlocked = false;
let authMode = 'login';

function saveSession(remember) {
  const storage = remember ? localStorage : sessionStorage;
  storage.setItem(TOKEN_KEY, JSON.stringify({
    user: currentUser.username, role: currentUser.role,
    expires: remember ? Date.now() + 7*24*60*60*1000 : Date.now() + 24*60*60*1000
  }));
}

function restoreSession() {
  let raw = localStorage.getItem(TOKEN_KEY) || sessionStorage.getItem(TOKEN_KEY);
  if (!raw) return false;
  try {
    const s = JSON.parse(raw);
    if (s.user && s.role && s.expires > Date.now()) {
      currentUser = { username: s.user, role: s.role };
      return true;
    }
  } catch(e) {}
  clearSession();
  return false;
}

function clearSession() {
  localStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(TOKEN_KEY);
  currentUser = null;
  isUnlocked = false;
}

async function handleLogin() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  errorEl.style.color = 'var(--danger)';

  if (!username) { errorEl.textContent = '请输入账号'; return; }

  if (authMode === 'login') {
    if (!password) { errorEl.textContent = '请输入密码'; return; }
    const remember = document.getElementById('rememberMe').checked;
    try {
      const db = await loadDB(true);
      const acct = db.data.accounts[username];
      if (!acct) throw new Error('账号不存在');
      if (acct.lockedUntil && Date.now() < acct.lockedUntil) {
        const min = Math.ceil((acct.lockedUntil - Date.now())/60000);
        throw new Error('账号已锁定，请 ' + min + ' 分钟后再试');
      }
      const hashed = await hashPassword(password);
      if (acct.password !== hashed) {
        acct.failedAttempts = (acct.failedAttempts || 0) + 1;
        if (acct.failedAttempts >= 5) { acct.lockedUntil = Date.now() + 30*60*1000; acct.failedAttempts = 0; saveDB(); throw new Error('密码错误次数过多，账号已锁定30分钟'); }
        saveDB();
        throw new Error('密码错误，还剩 ' + (5 - acct.failedAttempts) + ' 次机会');
      }
      acct.failedAttempts = 0; acct.lockedUntil = null;
      currentUser = { username, role: acct.role };
      saveDB();
      saveSession(remember);
      unlockApp();
    } catch(e) {
      errorEl.textContent = e.message;
      document.getElementById('loginPassword').value = '';
    }
  } else if (authMode === 'change-pwd') {
    if (!password) { errorEl.textContent = '请输入旧密码'; return; }
    window._oldPwd = password;
    authMode = 'change-pwd-new';
    document.getElementById('loginPassword').value = '';
    document.getElementById('loginPasswordConfirm').value = '';
    updateLoginUI();
    document.getElementById('loginPassword').focus();
  } else if (authMode === 'change-pwd-new') {
    const confirm = document.getElementById('loginPasswordConfirm').value.trim();
    if (password.length < 4) { errorEl.textContent = '密码至少4位'; return; }
    if (password !== confirm) { errorEl.textContent = '两次密码不一致'; return; }
    try {
      const db = await loadDB();
      const acct = db.data.accounts[currentUser.username];
      if (!acct) throw new Error('账号不存在');
      const oldHashed = await hashPassword(window._oldPwd);
      if (acct.password !== oldHashed) throw new Error('旧密码错误');
      acct.password = await hashPassword(password);
      await saveDB();
      delete window._oldPwd;
      unlockApp();
    } catch(e) {
      errorEl.textContent = e.message;
      document.getElementById('loginPassword').value = '';
      document.getElementById('loginPasswordConfirm').value = '';
    }
  }
}

async function unlockApp() {
  isUnlocked = true;
  document.getElementById('loginOverlay').classList.add('hidden');
  document.getElementById('statusBar').style.display = 'flex';
  document.getElementById('headerUser').textContent = '☁️ ' + currentUser.username;
  updateRoleBadge();
  updateUIForRole();
  await refreshTrialCache();
  updateTrialBadge();
  startAutoLock();
  resetActivityTimer();
  if (!window._dataLoaded) { await loadData(); renderAll(); window._dataLoaded = true; }
  else { renderAll(); }
  setStatus('online', '在线');
}

function lockScreen() {
  if (!isUnlocked) return;
  isUnlocked = false;
  clearSession();
  stopAutoLock();
  document.getElementById('statusBar').style.display = 'none';
  document.getElementById('loginOverlay').classList.remove('hidden');
  document.getElementById('loginUsername').value = '';
  document.getElementById('loginPassword').value = '';
  document.getElementById('loginError').textContent = '';
  authMode = 'login';
  updateLoginUI();
  document.getElementById('loginUsername').focus();
}

function changePassword() {
  if (!confirm('确定修改密码？')) return;
  lockScreen();
  authMode = 'change-pwd';
  document.getElementById('loginUsername').value = currentUser?.username || '';
  updateLoginUI();
  document.getElementById('loginPassword').focus();
}

function handleForgotPassword() { alert('联系管理员 ' + ADMIN_USERNAME + ' 重置密码。'); }

function updateLoginUI() {
  document.getElementById('loginError').textContent = '';
  document.getElementById('loginError').style.color = 'var(--danger)';
  document.getElementById('confirmPwdGroup').style.display = 'none';
  document.getElementById('rememberRow').style.display = authMode === 'login' ? 'flex' : 'none';
  document.getElementById('forgotLink').style.display = authMode === 'login' ? 'inline-block' : 'none';
  document.getElementById('loginUsername').disabled = (authMode === 'change-pwd-new');
  if (authMode === 'login') {
    document.getElementById('loginTitle').textContent = '☁️ 茶叶库存管理';
    document.getElementById('loginSubtitle').textContent = '云端同步 · 多设备访问 · 数据不丢失';
    document.getElementById('loginBtn').textContent = '登录';
    document.getElementById('loginUsername').placeholder = '输入账号';
    document.getElementById('loginPassword').placeholder = '输入密码';
  } else if (authMode === 'change-pwd') {
    document.getElementById('loginTitle').textContent = '🔑 修改密码';
    document.getElementById('loginSubtitle').textContent = '请输入旧密码验证身份';
    document.getElementById('loginBtn').textContent = '验证旧密码';
    document.getElementById('loginPassword').placeholder = '输入旧密码';
  } else if (authMode === 'change-pwd-new') {
    document.getElementById('loginTitle').textContent = '🔑 设置新密码';
    document.getElementById('loginSubtitle').textContent = '旧密码已通过，请输入新密码';
    document.getElementById('loginBtn').textContent = '确认修改';
    document.getElementById('confirmPwdGroup').style.display = 'block';
    document.getElementById('loginPassword').placeholder = '输入新密码（至少4位）';
  }
}

// ==================== AUTO-LOCK ====================
let autoLockInterval = null, lastActivityTime = Date.now();

function resetActivityTimer() { lastActivityTime = Date.now(); updateLockTimer(); }
function startAutoLock() {
  if (autoLockInterval) clearInterval(autoLockInterval);
  autoLockInterval = setInterval(() => {
    const idle = (Date.now() - lastActivityTime)/1000;
    if (idle >= AUTO_LOCK_MINUTES*60 && isUnlocked) doAutoLock();
    updateLockTimer();
  }, 10000);
}
function stopAutoLock() { if(autoLockInterval){clearInterval(autoLockInterval);autoLockInterval=null;} }
function doAutoLock() {
  isUnlocked=false; clearSession(); stopAutoLock();
  document.getElementById('statusBar').style.display='none';
  document.getElementById('loginOverlay').classList.remove('hidden');
  document.getElementById('loginUsername').value=''; document.getElementById('loginPassword').value='';
  document.getElementById('loginError').textContent='屏幕已自动锁定（15分钟无操作）';
  document.getElementById('loginError').style.color='#e67e22';
  authMode='login'; updateLoginUI();
}
function updateLockTimer() {
  const el=document.getElementById('autoLockTimer'); if(!el)return;
  if(!isUnlocked){el.textContent='';return;}
  const rem=Math.max(0,AUTO_LOCK_MINUTES*60-Math.floor((Date.now()-lastActivityTime)/1000));
  el.textContent=rem>60?`⏱ ${Math.floor(rem/60)}分${rem%60}秒后锁定`:`⏱ ${rem}秒后锁定`;
}

// ==================== PERMISSIONS ====================
let trialRemainingCache = null;
function getCurrentRole() { return currentUser?.role || 'viewer'; }
function canView() { return true; }
function canEdit() { const r=getCurrentRole(); return r==='admin'||r==='operator'||r==='trial'; }
function canManage() { return getCurrentRole()==='admin'; }

async function refreshTrialCache() {
  if (getCurrentRole() !== 'trial' || !currentUser) { trialRemainingCache = null; return; }
  try {
    const db = dbCache || await loadDB();
    const tc = db.data.accounts[currentUser.username]?.trialCounts || {};
    trialRemainingCache = TRIAL_ACTIONS.reduce((s,a) => s + Math.max(0, TRIAL_LIMIT - (tc[a]||0)), 0);
  } catch(e) { trialRemainingCache = null; }
}

const ACTION_LABELS = { add:'添加', edit:'编辑', delete:'删除', consume:'消耗', awaken:'醒茶', import:'导入', reset:'清空' };

async function checkPermThen(action, fn) {
  if (!currentUser || !isUnlocked) { lockScreen(); return; }
  const role = getCurrentRole();
  if (role === 'viewer') { alert('您只有查看权限。\n请联系管理员 ' + ADMIN_USERNAME + ' 获取操作权限。'); return; }
  if (role === 'trial' && TRIAL_ACTIONS.includes(action)) {
    const db = dbCache || await loadDB();
    const acct = db.data.accounts[currentUser.username];
    if (!acct) return;
    if (!acct.trialCounts) acct.trialCounts = {};
    const count = (acct.trialCounts[action] || 0) + 1;
    if (count > TRIAL_LIMIT) {
      alert('「' + (ACTION_LABELS[action]||action) + '」体验次数已用完（共' + TRIAL_LIMIT + '次）。\n请联系管理员升级权限。');
      return;
    }
    acct.trialCounts[action] = count;
    await saveDB();
    await refreshTrialCache();
    updateTrialBadge();
  }
  resetActivityTimer();
  fn();
}

// ==================== UI HELPERS ====================
function updateRoleBadge() {
  const el = document.getElementById('headerRoleBadge'); if(!el)return;

  const labels={admin:'管理员',operator:'操作权限',trial:'体验权限',viewer:'查看权限'};

  else if(currentCategory!=='生茶') document.getElementById('catAwakeBtn').style.display='none';
}

// ==================== DATA LAYER ====================
const CATEGORIES = ['白茶','熟茶','生茶','六堡','红茶','黑茶','武夷岩茶','乌龙茶','特殊品类','茶器'];
const CURRENT_YEAR = new Date().getFullYear();

function extractYear(y) { if(!y||typeof y!=='string')return null; const m=y.match(/\b(19\d{2}|20\d{2})\b/); if(!m)return null; const yr=parseInt(m[0]); return (yr>=1900&&yr<=CURRENT_YEAR)?yr:null; }

function getTeaAge(y) { const teaYr=extractYear(y); if(teaYr===null) return {years:null,label:'—',cssClass:'age-badge-na'}; const age=CURRENT_YEAR-teaYr; if(age<5)return{years:age,label:'新茶',cssClass:'age-badge-new'}; if(age<10)return{years:age,label:'转化茶',cssClass:'age-badge-transition'}; if(age<15)return{years:age,label:'中期茶',cssClass:'age-badge-mid'}; return{years:age,label:'老茶',cssClass:'age-badge-aged'}; }

function itemTotalWeight(i){return(i.unitWeight||0)*(i.quantity||0);}
function itemTotalPrice(i){return(i.unitPrice||0)*(i.quantity||0);}

function ensureDefaults(item) {
  return { name:item.name||'', brand:item.brand||'', model:item.model||'', year:item.year||'', origin:item.origin||'', spec:item.spec||'饼茶', quantity:item.quantity||1, unitWeight:item.unitWeight||0, unitPrice:item.unitPrice||0, purchaseDate:item.purchaseDate||'', location:item.location||'', status:item.status||'未拆封', awakeningQty:item.awakeningQty||0, note:item.note||'' };
}

const DEFAULT_DATA = {};
let data = {};

async function loadData() {
  try {
    const db = await loadDB(true);
    const td = db.data.teaData[currentUser.username] || {};
    data = {};
    CATEGORIES.forEach(c => { data[c] = (td[c] || []).map(ensureDefaults); });
    if (Object.values(data).every(arr => arr.length === 0)) {
      // First login: auto-initialize with defaults
      data = JSON.parse(JSON.stringify({
        '白茶': [{ name:'白毫银针', brand:'品品香', model:'', year:'2023', origin:'福鼎', spec:'散茶', quantity:2, unitWeight:250, unitPrice:340, purchaseDate:'2023-03-15', location:'茶柜上层', status:'已拆封', awakeningQty:0, note:'毫香明显' }],
        '生茶': [{ name:'大益7542', brand:'大益', model:'7542', year:'2021', origin:'勐海', spec:'饼茶', quantity:2, unitWeight:357, unitPrice:140, purchaseDate:'2022-05-20', location:'茶柜下层', status:'已拆封', awakeningQty:0, note:'' }],
      }));
      db.data.teaData[currentUser.username] = data;
      await saveDB();
    }
  } catch(e) { console.warn('加载失败，使用空数据', e); CATEGORIES.forEach(c=>{if(!data[c])data[c]=[];}); }
}

async function saveDataLocal() {
  try {
    const db = dbCache || await loadDB();
    if (!db.data.teaData[currentUser.username]) db.data.teaData[currentUser.username] = {};

    await saveDB();
  } catch(e) { console.warn('保存失败', e); }
}

function saveItem() {

  if(!name){alert('请输入品种/名称');return;}
  const qty=parseInt(document.getElementById('fQuantity').value)||1;

function selConsume(idx){ consumeSelectedIdx=idx; document.querySelectorAll('#consumeItemList .select-item-row').forEach(el=>el.classList.remove('selected')); const row=document.getElementById('cRow'+idx); if(row)row.classList.add('selected'); document.getElementById('consumeInputRow').style.display='flex';document.getElementById('consumeAmount').value='';document.getElementById('consumeSaveBtn').disabled=true; const amtEl=document.getElementById('consumeAmount'); amtEl.oninput=()=>{ const a=parseFloat(amtEl.value); const item=data[consumeSelectedCat][consumeSelectedIdx]; const m=item?itemTotalWeight(item):0; if(!a||a<=0){document.getElementById('consumeError').textContent='';document.getElementById('consumeSaveBtn').disabled=true;} else if(a>m){document.getElementById('consumeError').textContent='不能超过 '+m+'g';document.getElementById('consumeSaveBtn').disabled=true;} else{document.getElementById('consumeError').textContent='扣除'+a+'g，剩余'+(m-a)+'g';document.getElementById('consumeSaveBtn').disabled=false;}}; amtEl.focus(); }
function saveConsume(){
  if(!consumeSelectedCat||consumeSelectedIdx===null)return; const a=parseFloat(document.getElementById('consumeAmount').value); if(!a||a<=0)return;

  saveDataLocal();closeConsumeModal();renderAll();
}

async function doDeleteAcc(u){ if(!confirm(`⚠️ 删除账��「${u}」？`))return; delete dbCache.data.accounts[u]; delete dbCache.data.teaData[u]; await saveDB(); renderAccList(); }

function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ==================== CSV ====================
function exportAllCSV() {
  const headers='茶类,名称,品牌,型号,年份,产地,规格,数量,单位重(g),总重(g),单价,总价,购买时间,存放位置,状态,备注';
  const rows=[headers];
  CATEGORIES.forEach(c=>{(data[c]||[]).forEach(item=>{ rows.push([c,csvE(item.name),csvE(item.brand),csvE(item.model),csvE(item.year),csvE(item.origin),csvE(item.spec),item.quantity,item.unitWeight,itemTotalWeight(item),(item.unitPrice||0).toFixed(2),itemTotalPrice(item).toFixed(2),csvE(item.purchaseDate),csvE(item.location),csvE(item.status),csvE(item.note)].join(',')); });});
  const b=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8;'}); const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download='茶叶库存_'+new Date().toISOString().slice(0,10)+'.csv'; a.click(); URL.revokeObjectURL(a.href);
}
function csvE(s){if(!s)return'';s=String(s);return(s.includes(',')||s.includes('"'))?'"'+s.replace(/"/g,'""')+'"':s;}
function importCSV(){
  const inp=document.createElement('input'); inp.type='file';inp.accept='.csv';
  inp.onchange=function(e){ const f=e.target.files[0]; if(!f)return; const r=new FileReader(); r.onload=function(ev){
    const lines=ev.target.result.split('\n').filter(l=>l.trim()); if(lines.length<2){alert('CSV为空');return;}
    const h=parseCSVLine(lines[0]); const ci=h.findIndex(h=>h.includes('茶类')); const ni=h.findIndex(h=>h.includes('品种')||h.includes('名称')); if(ci<0||ni<0){alert('CSV必须含"茶类"和"名称"列');return;}
    const fi=(ks)=>{for(let k of ks){const i=h.findIndex(h=>h.includes(k));if(i>=0)return i;}return-1;};
    let c=0; for(let i=1;i<lines.length;i++){ const cols=parseCSVLine(lines[i]); if(!cols.length)continue; const cat=(cols[ci]||'').trim(); const name=(cols[ni]||'').trim(); if(!cat||!name||!CATEGORIES.includes(cat))continue; if(!data[cat])data[cat]=[];
      data[cat].push(ensureDefaults({name,brand:(cols[fi(['品牌'])]||'').trim(),model:(cols[fi(['型号'])]||'').trim(),year:(cols[fi(['年份'])]||'').trim(),origin:(cols[fi(['产地'])]||'').trim(),spec:(cols[fi(['规格'])]||'').trim()||'饼茶',quantity:parseInt(cols[fi(['数量'])])||1,unitWeight:parseFloat(cols[fi(['单位重量','单位重'])])||0,unitPrice:parseFloat(cols[fi(['单价'])])||0,purchaseDate:(cols[fi(['购买时间'])]||'').trim(),location:(cols[fi(['存放位置'])]||'').trim(),status:(cols[fi(['状态'])]||'未拆封').trim(),note:(cols[fi(['备注'])]||'').trim()})); c++; }
    saveDataLocal();renderAll(); alert(`导入 ${c} 条记录！`);
  }; r.readAsText(f,'UTF-8'); }; inp.click();
}
function parseCSVLine(l){ const r=[];let cur='',iq=false; for(let i=0;i<l.length;i++){ const ch=l[i]; if(iq){if(ch==='"'){if(i+1<l.length&&l[i+1]==='"'){cur+='"';i++;}else iq=false;}else cur+=ch;}else{if(ch==='"')iq=true;else if(ch===','){r.push(cur);cur='';}else cur+=ch;}} r.push(cur); return r; }

function resetAll(){ if(confirm('确定清空所有数据？')){ data={}; CATEGORIES.forEach(c=>{data[c]=[];}); saveDataLocal(); renderAll(); } }

// ==================== INIT ====================
document.addEventListener('DOMContentLoaded', async function(){
  ['mousemove','keydown','click','scroll','touchstart'].forEach(e=>document.addEventListener(e,()=>{if(isUnlocked)resetActivityTimer();}));
  const lb=document.querySelector('.login-box'); if(lb)lb.addEventListener('keydown',e=>{if(e.key==='Enter')handleLogin();});

  if(restoreSession()){
    try {
      await loadDB();
      isUnlocked=true;
      document.getElementById('loginOverlay').classList.add('hidden');
      document.getElementById('statusBar').style.display='flex';
      document.getElementById('headerUser').textContent='☁️ '+currentUser.username;
      updateRoleBadge(); updateUIForRole(); await refreshTrialCache(); updateTrialBadge();
      startAutoLock(); resetActivityTimer();
      await loadData(); renderAll(); window._dataLoaded=true;
      setStatus('online','在线');
    } catch(e) { clearSession(); document.getElementById('loginOverlay').classList.remove('hidden'); document.getElementById('loginError').textContent='连接失败，请重试：'+e.message; }
  } else {
    document.getElementById('loginOverlay').classList.remove('hidden');
  }
});
</script>
